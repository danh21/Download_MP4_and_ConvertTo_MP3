name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe with PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --name "YoutubePlaylistDownloader" app.py

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: YoutubePlaylistDownloader-windows
          path: dist/YoutubePlaylistDownloader.exe

      - name: Create GitHub Release (only on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YoutubePlaylistDownloader.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
